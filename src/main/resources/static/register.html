<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — FixIt Campus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/custom.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md space-y-6">
        <div class="text-center space-y-2">
            <a href="/index.html" class="inline-flex items-center gap-2.5">
                <div class="w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                    <i data-lucide="user-plus" class="w-6 h-6"></i>
                </div>
            </a>
            <h2 class="text-2xl font-extrabold text-slate-900">Create Account</h2>
            <p class="text-sm text-slate-500">Register as a student, technician, or administrator</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-200 p-8 space-y-6">
            <div id="error-alert" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium"></div>

            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
                    <input type="text" id="name" required placeholder="Enter your full name"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Username</label>
                    <input type="text" id="username" required placeholder="Choose a unique username"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                        Account Type / Role <span class="text-rose-500">*</span>
                    </label>
                    <select id="role" required
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition bg-white">
                        <option value="ROLE_STUDENT" selected>Student (Report & Track Issues)</option>
                        <option value="ROLE_TECHNICIAN">Technician (Resolve Assigned Issues)</option>
                        <option value="ROLE_ADMIN">Campus Administrator (Full Management)</option>
                    </select>
                </div>

                <div id="specialization-group" class="hidden">
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                        Technician Specialization
                    </label>
                    <input type="text" id="specialization" placeholder="e.g. Electrical, Plumbing, IT & Wi-Fi, HVAC"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Campus Email</label>
                    <input type="email" id="email" required placeholder="user@campus.edu"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Optional phone number"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition">
                </div>

                <div class="grid sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                        <input type="password" id="password" required minlength="6" placeholder="Minimum 6 characters"
                               class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Confirm Password</label>
                        <input type="password" id="confirmPassword" required minlength="6" placeholder="Re-enter password"
                               class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition">
                    </div>
                </div>

                <button type="submit" id="submit-btn"
                        class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-md shadow-indigo-200 transition flex items-center justify-center gap-2">
                    <span>Create Account</span>
                    <i data-lucide="check" class="w-4 h-4"></i>
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-slate-500">
            Already have an account?
            <a href="/login.html" class="font-semibold text-indigo-600 hover:underline">Sign in</a>
        </p>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        lucide.createIcons();

        const form = document.getElementById('register-form');
        const errorAlert = document.getElementById('error-alert');
        const submitBtn = document.getElementById('submit-btn');
        const roleSelect = document.getElementById('role');
        const specGroup = document.getElementById('specialization-group');
        const specInput = document.getElementById('specialization');

        roleSelect.addEventListener('change', () => {
            if (roleSelect.value === 'ROLE_TECHNICIAN') {
                specGroup.classList.remove('hidden');
            } else {
                specGroup.classList.add('hidden');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.classList.add('hidden');

            const name = document.getElementById('name').value.trim();
            const username = document.getElementById('username').value.trim();
            const role = roleSelect.value;
            const specialization = specInput ? specInput.value.trim() : '';
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const phone = document.getElementById('phone').value.trim();

            if (password !== confirmPassword) {
                errorAlert.textContent = 'Passwords do not match. Please re-enter identical passwords.';
                errorAlert.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Creating account...</span>`;

            try {
                const user = await Auth.register(name, username, email, password, phone, role, specialization);
                UI.showToast(`Account created! Welcome, ${user.name}`, 'success');
                setTimeout(() => {
                    Auth.redirectBasedOnRole(user.role);
                }, 600);
            } catch (err) {
                errorAlert.textContent = err.message || 'Registration failed.';
                errorAlert.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Create Account</span><i data-lucide="check" class="w-4 h-4"></i>`;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>

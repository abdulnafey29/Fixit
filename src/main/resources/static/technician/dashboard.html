<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technician Work Orders — FixIt Campus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/custom.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col">

    <!-- Topbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/technician/dashboard.html" class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-100">
                        <i data-lucide="wrench" class="w-4 h-4"></i>
                    </div>
                    <span class="font-bold text-lg text-slate-900 tracking-tight">Fix<span class="text-indigo-600">It</span></span>
                </a>
                <span class="hidden sm:inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                    Technician Work Orders
                </span>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3">
                    <div id="navbar-user-avatar" class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-700 font-bold text-xs flex items-center justify-center"></div>
                    <div class="hidden sm:block text-left leading-tight">
                        <p id="navbar-user-name" class="text-xs font-bold text-slate-800"></p>
                        <p id="navbar-user-username" class="text-[11px] font-medium text-slate-500"></p>
                        <div class="flex items-center gap-1.5 mt-0.5">
                            <span id="navbar-user-role" class="text-[10px] text-emerald-700 font-bold uppercase tracking-wider"></span>
                            <span class="text-slate-300 text-[10px]">•</span>
                            <span id="tech-specialization" class="text-[10px] text-emerald-600 font-medium"></span>
                        </div>
                    </div>
                </div>
                <button onclick="Auth.logout()" id="logout-btn" title="Logout"
                        class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-rose-600 hover:bg-rose-50 rounded-xl border border-slate-200 transition cursor-pointer">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Assigned Work Orders</h1>
                <p class="text-xs text-slate-500 mt-0.5">Manage tasks assigned by administration, log repair steps, and mark issues as resolved.</p>
            </div>
            <button onclick="loadAssignedComplaints()" class="px-3.5 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-xs font-semibold text-slate-700 shadow-sm transition flex items-center gap-1.5 self-start sm:self-auto">
                <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> Refresh Tasks
            </button>
        </div>

        <!-- Metric Badges -->
        <div class="grid grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-1">
                <span class="text-[10px] font-bold text-slate-400 uppercase">Assigned Total</span>
                <p id="stat-total" class="text-2xl font-black text-slate-900">0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-1">
                <span class="text-[10px] font-bold text-indigo-500 uppercase">Active / In Progress</span>
                <p id="stat-active" class="text-2xl font-black text-indigo-600">0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-1">
                <span class="text-[10px] font-bold text-emerald-500 uppercase">Completed</span>
                <p id="stat-completed" class="text-2xl font-black text-emerald-600">0</p>
            </div>
        </div>

        <!-- Work Orders List -->
        <div class="space-y-4">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Work Queue (Ordered by Urgency)</h2>
            <div id="tasks-container" class="space-y-4">
                <p class="text-xs text-slate-400">Loading work orders...</p>
            </div>
        </div>

    </main>

    <!-- Resolve Modal -->
    <div id="resolve-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="text-base font-bold text-slate-900">Mark Issue as Resolved</h3>
                <button onclick="closeResolveModal()" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <p class="text-xs text-slate-500" id="modal-task-title">Complaint #...</p>

            <form id="resolve-form" class="space-y-4">
                <input type="hidden" id="modal-task-id">

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">
                        Resolution Notes / Work Performed <span class="text-rose-500">*</span>
                    </label>
                    <textarea id="modal-resolve-comment" required rows="3"
                              placeholder="e.g. Replaced burnt capacitor on the motor, lubricated bearings, and verified normal operation."
                              class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <div class="flex items-center justify-end gap-2 pt-2">
                    <button type="button" onclick="closeResolveModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50">Cancel</button>
                    <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold">Confirm Resolved</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        lucide.createIcons();

        if (!Auth.requireRole('ROLE_TECHNICIAN')) {
            // stopped
        } else {
            UI.initNavbar('dashboard');
            loadAssignedComplaints();
        }

        async function loadAssignedComplaints() {
            try {
                const [complaintsRes, statsRes] = await Promise.all([
                    API.get('/technician/complaints'),
                    API.get('/technician/stats').catch(() => null)
                ]);
                const complaints = complaintsRes.data || [];

                // Stats
                let total = complaints.length;
                let active = complaints.filter(c => c.status === 'ASSIGNED' || c.status === 'IN_PROGRESS').length;
                let completed = complaints.filter(c => c.status === 'RESOLVED').length;

                if (statsRes && statsRes.data) {
                    total = statsRes.data.totalAssigned !== undefined ? statsRes.data.totalAssigned : complaints.length;
                    active = statsRes.data.active !== undefined ? statsRes.data.active : 0;
                    completed = statsRes.data.completed !== undefined ? statsRes.data.completed : 0;
                }

                document.getElementById('stat-total').textContent = total;
                document.getElementById('stat-active').textContent = active;
                document.getElementById('stat-completed').textContent = completed;

                renderTasks(complaints);
            } catch (err) {
                console.error(err);
                UI.showToast('Failed to load assigned complaints', 'error');
            }
        }

        function renderTasks(complaints) {
            const container = document.getElementById('tasks-container');
            if (complaints.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-12 rounded-2xl border border-slate-200 text-center space-y-2">
                        <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto">
                            <i data-lucide="check-circle" class="w-6 h-6"></i>
                        </div>
                        <h3 class="font-bold text-slate-800">No Assigned Tasks</h3>
                        <p class="text-xs text-slate-400">You have no pending maintenance requests currently assigned.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = complaints.map(c => `
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 hover:border-indigo-200 transition">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-3">
                        <div class="flex items-center gap-3">
                            <span class="font-mono font-bold text-xs px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700">#${c.id}</span>
                            ${UI.getPriorityBadge(c.priority)}
                            ${UI.getStatusBadge(c.status)}
                        </div>
                        <span class="text-[11px] text-slate-400">${UI.formatDate(c.createdAt)}</span>
                    </div>

                    <div class="grid sm:grid-cols-12 gap-4 items-center">
                        <div class="sm:col-span-8 space-y-1">
                            <h3 class="font-bold text-sm text-slate-900">${escapeHtml(c.title)}</h3>
                            <p class="text-xs text-slate-600 line-clamp-2">${escapeHtml(c.description)}</p>
                            <div class="flex flex-wrap items-center gap-4 text-xs text-slate-500 pt-1">
                                <span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-400"></i> ${escapeHtml(c.locationDisplay)}</span>
                                <span class="flex items-center gap-1"><i data-lucide="tag" class="w-3.5 h-3.5 text-slate-400"></i> ${escapeHtml(c.categoryName)}</span>
                                <span class="flex items-center gap-1"><i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i> Reported by ${escapeHtml(c.studentName)}</span>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="sm:col-span-4 flex sm:flex-col items-center sm:items-end justify-end gap-2 pt-2 sm:pt-0">
                            ${c.status === 'ASSIGNED' ? `
                                <button onclick="startJob(${c.id})"
                                        class="w-full sm:w-auto px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow-sm transition flex items-center justify-center gap-1.5">
                                    <i data-lucide="play" class="w-3.5 h-3.5"></i> Start Repair
                                </button>
                            ` : ''}

                            ${c.status === 'IN_PROGRESS' ? `
                                <button onclick="openResolveModal(${c.id}, '${escapeHtml(c.title)}')"
                                        class="w-full sm:w-auto px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold shadow-sm transition flex items-center justify-center gap-1.5">
                                    <i data-lucide="check" class="w-3.5 h-3.5"></i> Mark Resolved
                                </button>
                            ` : ''}

                            <a href="/technician/detail.html?id=${c.id}"
                               class="w-full sm:w-auto px-3.5 py-1.5 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 text-xs font-medium transition text-center">
                                View Details & Notes
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        async function startJob(id) {
            try {
                await API.put(`/technician/complaints/${id}/start`, { comment: 'Technician started active repair' });
                UI.showToast(`Started work on Complaint #${id}!`, 'success');
                loadAssignedComplaints();
            } catch (err) {
                UI.showToast(err.message || 'Failed to update status', 'error');
            }
        }

        function openResolveModal(id, title) {
            document.getElementById('modal-task-id').value = id;
            document.getElementById('modal-task-title').textContent = `Resolving #${id}: ${title}`;
            document.getElementById('modal-resolve-comment').value = '';
            document.getElementById('resolve-modal').classList.remove('hidden');
        }

        function closeResolveModal() {
            document.getElementById('resolve-modal').classList.add('hidden');
        }

        document.getElementById('resolve-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('modal-task-id').value;
            const comment = document.getElementById('modal-resolve-comment').value;

            try {
                await API.put(`/technician/complaints/${id}/resolve`, { comment });
                UI.showToast(`Complaint #${id} marked as Resolved!`, 'success');
                closeResolveModal();
                loadAssignedComplaints();
            } catch (err) {
                UI.showToast(err.message || 'Failed to resolve', 'error');
            }
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>

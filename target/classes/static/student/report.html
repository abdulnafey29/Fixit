<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report an Issue — FixIt Campus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/custom.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col">

    <!-- Topbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/student/dashboard.html" class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-100">
                        <i data-lucide="wrench" class="w-4 h-4"></i>
                    </div>
                    <span class="font-bold text-lg text-slate-900 tracking-tight">Fix<span class="text-indigo-600">It</span></span>
                </a>
                <span class="text-slate-300">/</span>
                <span class="text-sm font-semibold text-slate-700">Report Problem</span>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3">
                    <div id="navbar-user-avatar" class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center"></div>
                    <div class="hidden sm:block text-left leading-tight">
                        <p id="navbar-user-name" class="text-xs font-bold text-slate-800"></p>
                        <p id="navbar-user-username" class="text-[11px] font-medium text-slate-500"></p>
                        <p id="navbar-user-role" class="text-[10px] text-indigo-600 font-bold uppercase tracking-wider"></p>
                    </div>
                </div>
                <a href="/student/dashboard.html" class="text-xs font-semibold text-slate-500 hover:text-indigo-600 flex items-center gap-1.5 transition border-l border-slate-200 pl-4 ml-1">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Dashboard
                </a>
                <button onclick="Auth.logout()" id="logout-btn" title="Logout"
                        class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-rose-600 hover:bg-rose-50 rounded-xl border border-slate-200 transition cursor-pointer">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">

            <div class="border-b border-slate-100 pb-4">
                <h1 class="text-xl font-bold text-slate-900">Submit a Campus Complaint</h1>
                <p class="text-xs text-slate-500 mt-1">Provide accurate location and details to help technicians resolve the issue faster.</p>
            </div>

            <form id="report-form" class="space-y-6">
                <!-- Title -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                        Issue Title <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="title" required
                           placeholder="e.g. Projector in Room 304 is not displaying anything"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition">
                </div>

                <!-- Category & Location -->
                <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Problem Category <span class="text-rose-500">*</span>
                        </label>
                        <select id="category" required
                                class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition bg-white">
                            <option value="">Select Category...</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Campus Location <span class="text-rose-500">*</span>
                        </label>
                        <input type="text" id="location" required
                               placeholder="Enter campus location, e.g. Block B - 3rd Floor - Room 304"
                               class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition">
                    </div>
                </div>

                <!-- Priority Selector -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                        Priority Urgency
                    </label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="priority" value="LOW" class="peer sr-only">
                            <div class="p-3 rounded-xl border border-slate-200 text-center peer-checked:border-indigo-600 peer-checked:bg-indigo-50/50 peer-checked:text-indigo-900 transition">
                                <span class="block text-xs font-bold">Low</span>
                                <span class="block text-[10px] text-slate-400">Minor cosmetic</span>
                            </div>
                        </label>

                        <label class="cursor-pointer">
                            <input type="radio" name="priority" value="MEDIUM" class="peer sr-only" checked>
                            <div class="p-3 rounded-xl border border-slate-200 text-center peer-checked:border-indigo-600 peer-checked:bg-indigo-50/50 peer-checked:text-indigo-900 transition">
                                <span class="block text-xs font-bold text-blue-700">Medium</span>
                                <span class="block text-[10px] text-slate-400">Normal priority</span>
                            </div>
                        </label>

                        <label class="cursor-pointer">
                            <input type="radio" name="priority" value="HIGH" class="peer sr-only">
                            <div class="p-3 rounded-xl border border-slate-200 text-center peer-checked:border-indigo-600 peer-checked:bg-indigo-50/50 peer-checked:text-indigo-900 transition">
                                <span class="block text-xs font-bold text-orange-700">High</span>
                                <span class="block text-[10px] text-slate-400">Disrupting class</span>
                            </div>
                        </label>

                        <label class="cursor-pointer">
                            <input type="radio" name="priority" value="CRITICAL" class="peer sr-only">
                            <div class="p-3 rounded-xl border border-slate-200 text-center peer-checked:border-indigo-600 peer-checked:bg-indigo-50/50 peer-checked:text-indigo-900 transition">
                                <span class="block text-xs font-bold text-rose-700">Critical</span>
                                <span class="block text-[10px] text-slate-400">Safety / Hazard</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                        Detailed Description <span class="text-rose-500">*</span>
                    </label>
                    <textarea id="description" required rows="4"
                              placeholder="Describe the problem, when it started, and exact room details..."
                              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition"></textarea>
                </div>

                <!-- Evidence Photo Upload -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                        Photo Evidence (Optional)
                    </label>
                    <div id="drop-area"
                         class="border-2 border-dashed border-slate-200 rounded-2xl p-6 text-center hover:border-indigo-400 transition cursor-pointer bg-slate-50/50">
                        <input type="file" id="image-input" accept="image/jpeg,image/png,image/webp" class="hidden">
                        <div id="upload-placeholder" class="space-y-2">
                            <div class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto">
                                <i data-lucide="camera" class="w-5 h-5"></i>
                            </div>
                            <p class="text-xs font-semibold text-slate-700">Click to upload or drag and drop image</p>
                            <p class="text-[10px] text-slate-400">JPG, PNG, or WEBP up to 10MB</p>
                        </div>
                        <div id="preview-container" class="hidden relative inline-block">
                            <img id="image-preview" class="max-h-48 rounded-xl shadow-md border border-slate-200 mx-auto" alt="Evidence Preview">
                            <button type="button" id="remove-image-btn"
                                    class="absolute -top-2 -right-2 bg-rose-600 text-white rounded-full p-1 shadow-md hover:bg-rose-700 transition">
                                <i data-lucide="x" class="w-3 h-3"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                    <a href="/student/dashboard.html"
                       class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-semibold text-xs hover:bg-slate-50 transition">
                        Cancel
                    </a>
                    <button type="submit" id="submit-btn"
                            class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs shadow-md shadow-indigo-200 transition flex items-center gap-2">
                        <i data-lucide="send" class="w-3.5 h-3.5"></i>
                        <span>Submit Complaint</span>
                    </button>
                </div>
            </form>

        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        lucide.createIcons();

        if (!Auth.requireRole('ROLE_STUDENT')) {
            // blocked
        } else {
            UI.initNavbar();
            loadMasterData();
            setupImageUpload();
        }

        async function loadMasterData() {
            try {
                const catRes = await API.get('/categories');
                const catSelect = document.getElementById('category');
                (catRes.data || []).forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.id;
                    opt.textContent = `${cat.name} — ${cat.description || ''}`;
                    catSelect.appendChild(opt);
                });
            } catch (err) {
                console.error(err);
                UI.showToast('Failed to load campus categories', 'error');
            }
        }

        let selectedFile = null;

        function setupImageUpload() {
            const dropArea = document.getElementById('drop-area');
            const fileInput = document.getElementById('image-input');
            const placeholder = document.getElementById('upload-placeholder');
            const previewContainer = document.getElementById('preview-container');
            const previewImg = document.getElementById('image-preview');
            const removeBtn = document.getElementById('remove-image-btn');

            dropArea.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    handleFile(e.target.files[0]);
                }
            });

            removeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                selectedFile = null;
                fileInput.value = '';
                previewContainer.classList.add('hidden');
                placeholder.classList.remove('hidden');
            });

            function handleFile(file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImg.src = e.target.result;
                    placeholder.classList.add('hidden');
                    previewContainer.classList.remove('hidden');
                    lucide.createIcons();
                };
                reader.readAsDataURL(file);
            }
        }

        const form = document.getElementById('report-form');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Submitting...</span>`;

            const formData = new FormData();
            formData.append('title', document.getElementById('title').value.trim());
            formData.append('categoryId', document.getElementById('category').value);
            formData.append('location', document.getElementById('location').value.trim());
            formData.append('priority', document.querySelector('input[name="priority"]:checked').value);
            formData.append('description', document.getElementById('description').value.trim());

            if (selectedFile) {
                formData.append('image', selectedFile);
            }

            try {
                const res = await API.postMultipart('/complaints', formData);
                UI.showToast('Complaint registered successfully!', 'success');
                setTimeout(() => {
                    window.location.href = `/student/detail.html?id=${res.data.id}`;
                }, 700);
            } catch (err) {
                UI.showToast(err.message || 'Submission failed. Try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i data-lucide="send" class="w-3.5 h-3.5"></i><span>Submit Complaint</span>`;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>

# ==============================================================================
# MySQL Database Configuration (Production / College Lab MySQL Mode)
# ==============================================================================
# Before running with MySQL, create the database:
# CREATE DATABASE fixit_db;

spring.datasource.url=jdbc:mysql://localhost:3306/fixit_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL Script Initialization
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ==============================================================================
# FixIt Campus Issue Management System - Configuration
# ==============================================================================
spring.application.name=FixIt-Campus-Issue-Management-System

# Server Port
server.port=8080

# ------------------------------------------------------------------------------
# Active Profile (Set to 'dev' for H2 in-memory DB or 'mysql' for MySQL)
# ------------------------------------------------------------------------------
spring.profiles.active=dev

# ------------------------------------------------------------------------------
# File Upload Configuration
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# ------------------------------------------------------------------------------
# JWT Security Configuration
# ------------------------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# ------------------------------------------------------------------------------
# Static Resources (For serving uploaded evidence photos)
# ------------------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/,file:uploads/
